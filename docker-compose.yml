services:
  video-store:
    build:
      context: ./src
      dockerfile: ./services/video-store/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - LOG_LEVEL=WARN
      - OTEL_SERVICE_NAME=video-store
    
  inference-receiver:
    build:
      context: ./src
      dockerfile: ./services/inference-receiver/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - LOG_LEVEL=WARN
      - OTEL_SERVICE_NAME=inference-receiver
    command: ["-port", "8082"]
    
  video-receiver:
    build: 
      context: ./src
      dockerfile: ./services/video-receiver/Dockerfile
    depends_on:
      - video-store
      - inference-receiver
    ports:
      - "8080:8080"
    environment:
      - LOG_LEVEL=DEBUG
      - OTEL_SERVICE_NAME=video-receiver
    command: ["-port", "8080"]
  
  video-feed:
    build: 
      context: ./src
      dockerfile: ./services/video-feed/Dockerfile
    depends_on:
      - video-receiver
    environment:
      - LOG_LEVEL=DEBUG
    command: ["-ip", "video-receiver", "-port", "8080"]
