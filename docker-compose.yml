services:
  receiver:
    build: 
      context: ./src
      dockerfile: ./services/receiver/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - LOG_LEVEL=DEBUG
    command: ["-port", "8080"]
  
  video-feed:
    build: 
      context: ./src
      dockerfile: ./services/video-feed/Dockerfile
    depends_on:
      - receiver
    environment:
      - LOG_LEVEL=DEBUG
    command: ["-ip", "receiver", "-port", "8080"]

