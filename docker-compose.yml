services:
  video-store:
    build:
      context: ./src
      dockerfile: ./services/storage/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - LOG_LEVEL=WARN
    
  inference-model:
    build:
      context: ./src
      dockerfile: ./services/mlmodels/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - LOG_LEVEL=WARN
    command: ["-port", "8082"]
    
  receiver:
    build: 
      context: ./src
      dockerfile: ./services/receiver/Dockerfile
    depends_on:
      - video-store
      - inference-model
    ports:
      - "8080:8080"
    environment:
      - LOG_LEVEL=DEBUG
    command: ["-port", "8080"]
  
  video-feed:
    build: 
      context: ./src
      dockerfile: ./services/video-feed/Dockerfile
    depends_on:
      - receiver
    environment:
      - LOG_LEVEL=DEBUG
    command: ["-ip", "receiver", "-port", "8080"]
