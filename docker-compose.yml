services:
  receiver:
    build: 
      context: ./src
      dockerfile: ./receiver/Dockerfile
    ports:
      - "8080:8080"
  
  video-feed:
    build: 
      context: ./src
      dockerfile: ./video-feed/Dockerfile
    depends_on:
      - receiver
    command: ["-ip", "receiver", "-port", "8080"]

  log-balancer:
    build:
      context: ./logger
      dockerfile: ./log-load-balancer/Dockerfile
